name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: 단위 테스트
        run: python -m pytest
      - name: (보너스) 뮤테이션 점수
        run: python tools/mutate.py --min-score 80
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright 설치
        working-directory: e2e-ts
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: E2E 테스트
        working-directory: e2e-ts
        run: npx playwright test
      - name: 리포트 올리기 (실패해도)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-ts/playwright-report
